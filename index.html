<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcora | Smart Calculator</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-violet-50 dark:bg-gray-950">


<!-- Main -->
<main class="w-full max-w-5xl px-6 ">
    <section class="mx-auto max-w-[340px]">

        <!-- Calculator Card -->
        <div class="rounded-3xl border border-violet-300 bg-white p-5 shadow-xl shadow-violet-950/10 dark:border-violet-800 dark:bg-gray-900">

            <!-- Calculator Controls -->
            <div class="mb-4 flex items-center justify-between">

                <!-- Mode Toggle -->
                <button id="modeToggle" class="flex items-center gap-2 rounded-xl border border-gray-200 px-3 py-2 text-sm font-semibold text-gray-700 dark:border-gray-700 dark:text-white">

                    <!-- Calculator Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 2.25H8.25A2.25 2.25 0 0 0 6 4.5v15A2.25 2.25 0 0 0 8.25 21.75h7.5A2.25 2.25 0 0 0 18 19.5v-15a2.25 2.25 0 0 0-2.25-2.25Z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75h6M9 10.5h.008M12 10.5h.008M15 10.5h.008M9 14.25h.008M12 14.25h.008M15 14.25h.008M9 18h.008M12 18h.008M15 18h.008"/>
                    </svg>

                    <span id="modeLabel">Standard</span>

                    <!-- Chevron Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                    </svg>
                </button>

                <!-- Theme Toggle -->
                <button id="themeToggle" class="rounded-xl border border-gray-200 p-2.5 text-gray-700 dark:border-gray-700 dark:text-white" aria-label="Toggle theme">

                    <!-- Moon Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 1 0 21.752 15.002Z"/>
                    </svg>
                </button>
            </div>

            <!-- Calculator Display -->
            <div class="rounded-2xl border border-gray-200 bg-white p-3 shadow-sm dark:border-gray-700 dark:bg-gray-950">
                <div id="expression" class="mb-2 min-h-5 overflow-x-auto text-right text-xs text-gray-400">0</div>
                <div id="result" class="min-h-9 overflow-y-hidden whitespace-nowrap text-right text-3xl font-bold text-gray-900 dark:text-white">0</div>
            </div>

<!-- Scientific Calculator Buttons -->
<div id="scientificButtons" class="mt-3 hidden grid-cols-4 gap-2">
    <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-violet-900">sin</button>
    <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-violet-900">cos</button>
    <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-violet-900">tan</button>
    <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-violet-900">√</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">x²</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">xʸ</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">log</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">ln</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">π</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">e</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">(</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">)</button>
</div>

      <!-- Calculator Buttons -->
<div id="calculatorButtons" class="mt-3 grid grid-cols-4 gap-2">
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-red-500 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800">AC</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">⌫</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-violet-600 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800">%</button>
    <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-violet-900">÷</button>

    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">7</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">8</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">9</button>
    <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-violet-900">×</button>

    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">4</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">5</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">6</button>
    <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-violet-900">−</button>

    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">1</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">2</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">3</button>
    <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-violet-900">+</button>

    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">±</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">0</button>
    <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-gray-800 dark:text-white">.</button>
    <button class="rounded-xl bg-violet-600 p-3 text-sm font-bold text-white transition-all duration-150 hover:scale-105 active:scale-95">=</button>
</div>
        </div>
    </section>
</main>

<script src="main.js"></script>
</body>
</html>
