<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcora | Smart Calculator</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-violet-50 dark:bg-[#32353d]">


<!-- Main -->
<main class="w-full max-w-5xl px-6 ">
    <section class="mx-auto max-w-[340px]">

       <!-- Calculator -->
<div class="rounded-3xl border border-gray-200 bg-white p-5 shadow-xl shadow-gray-900/10 transition-colors duration-300 dark:border-gray-700 dark:bg-[#22252D]">

    <!-- Top Controls -->
    <div class="mb-4 flex items-center justify-between">

        <!-- Mode Toggle -->
        <button id="modeToggle" class="flex items-center gap-2 text-sm font-semibold text-gray-700 transition-colors hover:text-violet-600 dark:text-gray-200 dark:hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4.5A1.5 1.5 0 0 1 5.5 3h13A1.5 1.5 0 0 1 20 4.5v15a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5v-15Z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h8M8 11h2m4 0h2m-8 4h2m4 0h2"/>
            </svg>
            <span id="modeLabel">Standard</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-4 w-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/>
            </svg>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggle" class="rounded-lg p-2 text-gray-600 transition-all duration-150 hover:bg-gray-100 hover:scale-105 active:scale-95 dark:text-gray-300 dark:hover:bg-gray-700">
            <!-- Moon Icon -->
            <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
            </svg>
            <!-- Sun Icon -->
            <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="hidden h-5 w-5">
                <circle cx="12" cy="12" r="4"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
            </svg>
        </button>
    </div>

    <!-- Display -->
    <div class="rounded-2xl border border-gray-200 bg-white p-3 shadow-sm transition-colors duration-300 dark:border-gray-700 dark:bg-[#17191F]">
        <div id="expression" class="mb-2 min-h-5 overflow-x-auto text-right text-xs text-gray-400">0</div>
        <div id="result" class="min-h-9 overflow-y-hidden whitespace-nowrap text-right text-3xl font-bold text-gray-900 dark:text-white">0</div>
    </div>

    <!-- Scientific Buttons -->
    <div id="scientificButtons" class="mt-3 hidden grid-cols-4 gap-2">

        <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#373B59] dark:text-indigo-200">sin</button>
        <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#373B59] dark:text-indigo-200">cos</button>
        <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#373B59] dark:text-indigo-200">tan</button>
        <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#373B59] dark:text-indigo-200">√</button>

        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-800 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">x²</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-800 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">xʸ</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-800 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">log</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-800 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">ln</button>

        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-800 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">π</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-800 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">e</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-800 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">(</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-800 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">)</button>

    </div>

    <!-- Standard Calculator Buttons -->
    <div id="calculatorButtons" class="mt-3 grid grid-cols-4 gap-2">

        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-red-500 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D]">AC</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-gray-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">⌫</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold text-violet-600 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-indigo-200">%</button>
        <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#373B59] dark:text-indigo-200">÷</button>

        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">7</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">8</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">9</button>
        <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#373B59] dark:text-indigo-200">×</button>

        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">4</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">5</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">6</button>
        <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#373B59] dark:text-indigo-200">−</button>

        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">1</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">2</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">3</button>
        <button class="rounded-xl bg-violet-100 p-3 text-sm font-semibold text-violet-700 transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#373B59] dark:text-indigo-200">+</button>

        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">±</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">0</button>
        <button class="rounded-xl bg-gray-100 p-3 text-sm font-semibold transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-[#30343D] dark:text-white">.</button>
        <button class="rounded-xl bg-violet-600 p-3 text-sm font-bold text-white transition-all duration-150 hover:scale-105 active:scale-95 dark:bg-indigo-600">=</button>

    </div>

</div>
    </section>
</main>

<script src="main.js"></script>
</body>
</html>
